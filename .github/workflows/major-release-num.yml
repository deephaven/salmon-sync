# Pulled from https://github.com/cicirello/jacoco-badge-generator/blob/main/.github/workflows/major-release-num.yml
# https://dev.to/cicirello/automate-updating-major-release-tag-on-new-releases-of-a-github-action-cci
name: Move Major Release Tag

on:
  release:
    types: [published]

permissions:
  contents: write # needed to push the moved tag

jobs:
  movetag:
    runs-on: ubuntu-latest
    if: github.event.release.prerelease == false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Get major version num and update tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          MAJOR=${VERSION%%.*}
          git config --global user.name 'Deephaven Bot'
          git config --global user.email 'operations@deephaven.io'
          git tag -fa ${MAJOR} -m "Update major version tag"
          git push origin ${MAJOR} --force
